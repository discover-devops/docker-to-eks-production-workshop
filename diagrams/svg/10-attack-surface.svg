="none"></path></g><text x="74" y="587" font-family="'Segoe Print','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="17" fill="#f08c00" font-weight="bold" text-anchor="start">What this actually buys you</text><text x="74" y="617" font-family="'Segoe Print','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="15" fill="#1e1e1e" text-anchor="start">An attacker who achieves code execution inside the container lands as an unprivileged user, on a read-only</text><text x="74" y="643" font-family="'Segoe Print','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="15" fill="#1e1e1e" text-anchor="start">filesystem, with no compiler to build tools and no package manager to install them. Most exploit chains stop there.</text><g><path d="M49.59590227611363 689.878770281002 C338.9378852270544 685.1143167125284, 626.8565039964765 686.0103297840654, 1190.4281781936436 689.1495853745192 M50.19896169599146 689.7600272035971 C375.5994284935668 693.9779563470408, 702.0539913223312 694.0218767483756, 1189.563116839491 690.4129590618983 M1191.0644433917478 688.5469630567356 C1190.4345954656676 721.9942394850775, 1189.8901908576563 757.116720190458, 1190.3505594016983 785.4528793839738 M1189.5900644614362 691.0016179830767 C1189.9573377585673 713.3878491432406, 1191.1847256189847 735.7323231966235, 1189.499135391321 786.7644744575955 M1189.399304246977 785.8153058253973 C937.2367200139165 785.0005674631, 683.3800147633999 783.9738347155452, 50.665113031938674 785.7511647116393 M1189.6462023228034 785.9923240447417 C786.8349960533156 787.8546226773485, 383.86447517048555 787.6896217987761, 50.22500094469637 786.0606014383212 M48.190310150571165 788.0612782208249 C47.3772515911892 753.5539950905368, 48.165889509423074 720.541581764631, 48.798600614257154 689.2502508072182 M51.05811243196949 786.9452035994269 C49.143183844473214 761.408681562636, 49.910401149775836 739.3441048116423, 49.92827325901017 690.4784856797196" stroke="#6741d9" stroke-width="2.6" fill="none"></path></g><text x="74" y="717" font-family="'Segoe Print','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="17" fill="#6741d9" font-weight="bold" text-anchor="start">And scan every build</text><text x="74" y="747" font-family="'Segoe Print','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="15" fill="#1e1e1e" text-anchor="start">Trivy reads the package manifests inside the image and reports known CVEs in both the OS packages and your</text><text x="74" y="773" font-family="'Segoe Print','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="15" fill="#1e1e1e" text-anchor="start">Python dependencies. In Module 14 this becomes a pipeline gate that fails the build on CRITICAL findings.</text></svg>